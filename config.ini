# 并发配置
[concurrency]
ConcurrencyEnable=true    # 并发开关，true/false
ConcurrencyNum=50         # 并发数量
ConcurrencySigRepeatNum=1000  # 信号重复次数

# 机型库配置
[dronesdb]
AllDronesDbPath=excel\机型库-根据算法部修改.xlsx    # 完整机型库路径
DronesDbPath=excel\机型库-根据算法部修改-回放信号.xlsx  # 回放信号机型库路径
ReadFromConfigFolderEnable=true  # 是否从配置文件夹读取id.txt和机型.txt

# 文件路径配置
[file]
ErrorHistoryFilePath=      # 错误历史文件路径（可选）
PreSendHistoryFilePath=待发送列表-20260423-105903.xlsx    # 待发送列表文件
QueryHistoryFilePath=查询列表20260407-164800.xlsx        # 查询历史文件
QueryHistroyFilePath=查询列表20260423-105903.xlsx    # 查询历史文件（备用）
ReportFilePath=分析报告20260423-105903.xlsx    # 分析报告文件

# 日志配置
[log]
LogLevel=info    # 日志级别：debug/info/error

# 网络配置
[network]
DevIp=192.168.85.238    # 设备IP地址

# 查询配置
[query]
AfterQueriedWaitTimes=6     # 查到后等待次数
MistakeFreq=15              # 频率误差容忍值(MHz)
NoQueryTimes2NextSig=115    # 查不到多少次后跳到下一个信号

# 定时任务配置
[scheduler]
Enable=false     # 定时任务开关
Hour=15         # 执行时间-小时
Minute=19        # 执行时间-分钟
Command=6       # 要执行的命令编号

# 信号配置
[signal]
CdFolderInterval=240        # 切换文件夹等待时间(秒)
DriveLetter=E               # 磁盘盘符
QueryDroneInterval=2        # 查询无人机间隔(秒)
SigDir=E:\xinhao-test-ok\单个信号\3DR    # 信号包根目录
SigPkgSendInterval=28       # 发送间隔时间(ms/MB)

# 时间配置
[time]
StartTime=20260423-105903    # 程序开始时间